
<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VibeRoom – Chatt</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <h1>VibeRoom</h1>
    <a href="home.html">Tillbaka</a>
  </header>

  <main class="section">
    <h2 id="room-name">Laddar chattrum...</h2>
    <p id="room-description"></p>

    <div class="auth-box">
     <div id="messages">Laddar meddelanden...</div>

<input id="message-input" type="text" placeholder="Skriv ett meddelande...">
<button id="send-button">Skicka</button>
<p id="message-status"></p>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://dmuomeeuriqlayyuwrim.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_MSdBBcMSPa8a6g3cTPFEWw_uUOOeigD";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

async function loadRoom() {
  const roomId = new URLSearchParams(window.location.search).get("room");

  if (!roomId) {
    document.getElementById("room-name").textContent = "Inget chattrum valt.";
    return;
  }

  const { data, error } = await supabaseClient
    .from("rooms")
    .select("name, description")
    .eq("id", roomId)
    .single();

  if (error || !data) {
    document.getElementById("room-name").textContent = "Kunde inte hitta chattrummet.";
    return;
  }

  document.getElementById("room-name").textContent = data.name;
  document.getElementById("room-description").textContent = data.description || "";
}

async function loadMessages() {
 const { data: authData } = await supabaseClient.auth.getUser();
console.log("Inloggad användare:", authData.user);
  const { data: { user } } = await supabaseClient.auth.getUser();
console.log("Inloggad användare:", user);
  const roomId = new URLSearchParams(window.location.search).get("room");
  const messagesList = document.getElementById("messages");

  const { data, error } = await supabaseClient
    .from("messages")
    .select("content, created_at, user_id")
    .eq("room_id", roomId)
    .order("created_at", { ascending: true });

  if (error) {
    messagesList.textContent = "Kunde inte ladda meddelanden.";
    return;
  }

  messagesList.innerHTML = "";

  if (!data || data.length === 0) {
    messagesList.textContent = "Inga meddelanden ännu. Skriv det första!";
    return;
  }

  const userIds = [...new Set(data.map(message => message.user_id))];

  const { data: profiles, error: profileError } = await supabaseClient
    .from("profiles")
    .select("user_id, username")
    .in("user_id", userIds);

  if (profileError) {
    messagesList.textContent = "Kunde inte ladda användarnamn.";
    return;
  }

  data.forEach(message => {
    const item = document.createElement("div");
    item.className = "message-bubble";

    const profile = profiles.find(p => p.user_id === message.user_id);

    const username = document.createElement("strong");
    username.textContent = profile ? "@" + profile.username : "Anonym";
    username.style.display = "block";
    username.style.marginBottom = "5px";

    const content = document.createElement("div");
    content.textContent = message.content;

    item.appendChild(username);
    item.appendChild(content);
    messagesList.appendChild(item);
  });
}

async function sendMessage() {
  const roomId = new URLSearchParams(window.location.search).get("room");
  const input = document.getElementById("message-input");
  const content = input.value.trim();

  if (!content) return;

  if (!user) {
    console.log("Inloggat användar-ID:", user.id);
    document.getElementById("message-status").textContent = "Du måste vara inloggad.";
    return;
  }

  const { error } = await supabaseClient
    .from("messages")
    .insert({
      room_id: Number(roomId),
      user_id: user.id,
      content: content
    });

  if (error) {
    document.getElementById("message-status").textContent = "Fel: " + error.message;
    return;
  }

  input.value = "";
  document.getElementById("message-status").textContent = "";
  await loadMessages();
}
async function sendMessage() {
  const roomId = new URLSearchParams(window.location.search).get("room");
  const input = document.getElementById("message-input");
  const content = input.value.trim();

  if (!content) return;

  const { data: { user } } = await supabaseClient.auth.getUser();

  if (!user) {
    document.getElementById("message-status").textContent = "Du måste vara inloggad.";
    return;
  }

  const { error } = await supabaseClient
    .from("messages")
    .insert({
      room_id: Number(roomId),
      user_id: user.id,
      content: content
    });

  if (error) {
    document.getElementById("message-status").textContent = "Fel: " + error.message;
    return;
  }

  input.value = "";
  document.getElementById("message-status").textContent = "";
  await loadMessages();
}
document.getElementById("send-button").addEventListener("click", sendMessage);

loadRoom();
loadMessages();
</script>
</body>
</html>
